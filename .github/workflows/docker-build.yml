name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-build.yml"
      - "package.json"
      - "yarn.lock"
      - "history/**"
      - "realtime/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/docker-build.yml"
      - "package.json"
      - "yarn.lock"
      - "history/**"
      - "realtime/**"

jobs:
  build:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: history
            dockerfile: history/Dockerfile
          - service: realtime
            dockerfile: realtime/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          tags: price-${{ matrix.service }}:ci
