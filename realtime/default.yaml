base: "BTC"

# the default is the first currency
quotes:
  - { code: "USD", symbol: "$", name: "US Dollar", flag: "🇺🇸" }
  - { code: "JMD", symbol: "J$", name: "Jamaican Dollar", flag: "🇯🇲" }
  # - { code: "EUR", symbol: "€", name: "Euro", flag: "🇪🇺" }
  # - { code: "GBP", symbol: "£", name: "British Pound", flag: "🇬🇧" }
  # - { code: "XCD", symbol: "$", name: "East Caribbean Dollar", flag: "🇦🇬" }
  # - { code: "ANG", symbol: "ƒ", name: "Netherlands Antillean Guilder", flag: "🇨🇼" }
  # - { code: "HTG", symbol: "G", name: "Haitian Gourde", flag: "🇭🇹" }
  # - { code: "BSD", symbol: "$", name: "Bahamian Dollar", flag: "🇧🇸" }
  # - { code: "BBD", symbol: "$", name: "Barbadian Dollar", flag: "🇧🇧" }
  # - { code: "BZD", symbol: "BZ$", name: "Belize Dollar", flag: "🇧🇿" }
  # - { code: "KYD", symbol: "$", name: "Cayman Islands Dollar", flag: "🇰🇾" }
  # - { code: "CUP", symbol: "$", name: "Cuban Peso", flag: "🇨🇺" }
  # - { code: "DOP", symbol: "RD$", name: "Dominican Peso", flag: "🇩🇴" }
  # - { code: "TTD", symbol: "TT$", name: "Trinidad and Tobago Dollar", flag: "🇹🇹" }
exchanges:
- name: "Ibex"
  enabled: true
  quoteAlias: "*"
  base: "BTC"
  quote: "USD"
  provider: "ibex"
  cron: "*/15 * * * * *"
  config:
    cacheSeconds: 180
    # Mirrors IBEX_RATES_V2_DEFAULT_TIMEOUT_MS in
    # src/services/exchanges/ibex — this copy exists for deployments that
    # replace the exchanges list wholesale, and a unit test asserts the two
    # match. Change them together.
    #
    # This provider ignored `timeout` until now, and the sdk under it installs
    # its abort controller only when one is configured — so Rates v2 has been
    # running with no client-side cap at all (undici's ~300s defaults, doubled
    # by withAuth's single 401 retry), not the sdk's documented 30s. 30000 is
    # therefore the first bound the Rates v2 *request* has ever had; tighten it
    # once that call's latency distribution is measured.
    #
    # Scope, precisely: this value reaches the Rates v2 request. The OAuth
    # token request withAuth performs first is a bare global `fetch` with no
    # signal (ibex-client/dist/authentication/index.js:28) and is NOT bounded
    # by it. The provider therefore also races the whole ticker fetch against
    # this same number inside its shared mutex, so a stalled auth host cannot
    # park every pair — see IBEX_RATES_V2_DEFAULT_TIMEOUT_MS in
    # src/services/exchanges/ibex.
    timeout: 30000
- name: "free-currency-rates-usd"
  enabled: true
  quoteAlias: "*"
  base: "BTC"
  quote: "*"
  excludedQuotes: ["USD"]
  provider: "free-currency-rates"
  cron: "*/5 * * * * *"
  config:
    baseUrl: "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies"
    fallbackUrl: "https://currency-api.pages.dev/v1/currencies"
    cacheSeconds: 1800
- name: "kraken"
  enabled: true
  quoteAlias: "*"
  base: "BTC"
  quote: "*"
  excludedQuotes: ["USD"]
  provider: "ccxt"
  cron: "*/20 * * * * *"
- name: "bitstamp"
  enabled: true
  quoteAlias: "*"
  base: "BTC"
  quote: "*"
  excludedQuotes: ["USD"]
  provider: "ccxt"
  cron: "*/15 * * * * *"

