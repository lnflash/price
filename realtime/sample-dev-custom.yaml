exchanges:
  - provider: "dev-mock"
    base: "BTC"
    quote: "*"
    enabled: true
    config:
      devMockPrice:
        BTC:
          EUR: 25910
          USD: 28275.07
    # Following require dummy values
    name: ""
    cron: "*/5 * * * * *"
  # IBEX "Swap Rates" (GET /rates) — fee/spread-inclusive executable rates,
  # vs the legacy "ibex" provider (Rates v2, mid-market-ish, display-only).
  # Requires IBEX_CLIENT_ID / IBEX_CLIENT_SECRET / IBEX_ENVIRONMENT.
  - name: "IbexSwap"
    enabled: false
    quoteAlias: "*"
    base: "BTC"
    quote: "USD"
    provider: "ibex-swap"
    cron: "*/15 * * * * *"
    config:
      cacheSeconds: 180
      # Pairs GET /rates rejects with "currency is not supported" (JMD, HTG,
      # CAD) are served by the legacy "ibex" provider instead. That decision
      # expires after this many seconds so the pair is re-probed — IBEX adding
      # a currency should not need a pod restart to take effect.
      unsupportedTtlSeconds: 3600
      # Cap on the Swap Rates probe (GET /rates). This is the value
      # `createIbexSwap` already defaults to — spelled out so both timeout
      # knobs are visible side by side. An unusable value (a YAML `10s`, an
      # empty string, 0) falls back to this default and logs a warn rather
      # than silently leaving the call uncapped.
      timeout: 5000
      # `timeout` above caps the Swap Rates probe ONLY. The legacy fallback leg
      # has its own knob, because Rates v2 is capped far looser than GET /rates
      # (see IBEX_RATES_V2_DEFAULT_TIMEOUT_MS in
      # src/services/exchanges/ibex) and inheriting the probe's 5s would put
      # the JMD fallback — the reason this provider has a fallback at all —
      # under a cap Rates v2 was explicitly kept away from. Defaults to
      # IBEX_RATES_V2_DEFAULT_TIMEOUT_MS; set it here to override that leg
      # independently.
      # legacyTimeout: 30000
